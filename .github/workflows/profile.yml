name: profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, README.md, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Обновить карточки и активность"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1f2328&color_dots=#ebedf0,#c8ccd1,#9198a1,#59636e,#1f2328
            dist/snake-dark.svg?color_snake=#f0f6fc&color_dots=#161b22,#30363d,#6e7681,#b1bac4,#f0f6fc
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Обновить змейку
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
